spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  application:
    name: stockcal-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockcal}
    username: ${DATABASE_USER:stockcal}
    password: ${DATABASE_PASSWORD:stockcal}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

stockcal:
  ai:
    enabled: ${STOCKCAL_AI_ENABLED:true}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  knowledge:
    notes-path: ${STOCKCAL_NOTES_PATH:}
  sms-api-key: ${SMS_API_KEY:}
  sms-dev-code: ${SMS_DEV_CODE:000000}
  market-api-key: ${TUSHARE_TOKEN:${MARKET_API_KEY:}}
  ai-api-key: ${OPENAI_API_KEY:${AI_API_KEY:}}
