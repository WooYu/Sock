spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  application:
    name: stockcal-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockcal}
    username: ${DATABASE_USER:stockcal}
    password: ${DATABASE_PASSWORD:stockcal}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

stockcal:
  scenario:
    jobs-enabled: ${STOCKCAL_SCENARIO_JOBS_ENABLED:true}
    scan-ms: ${STOCKCAL_SCENARIO_SCAN_MS:900000}
    retry-base-seconds: ${STOCKCAL_SCENARIO_RETRY_BASE_SECONDS:900}
    retry-max-seconds: ${STOCKCAL_SCENARIO_RETRY_MAX_SECONDS:21600}
  prediction:
    # Comma-separated exchange closure dates (YYYY-MM-DD); weekends are always excluded.
    exchange-holidays: ${STOCKCAL_PREDICTION_EXCHANGE_HOLIDAYS:}
  auth:
    required: ${STOCKCAL_AUTH_REQUIRED:true}
  ai:
    enabled: ${STOCKCAL_AI_ENABLED:true}
    model: ${STOCKCAL_AI_MODEL:${OPENAI_MODEL:deepseek-chat}}
    base-url: ${STOCKCAL_AI_BASE_URL:https://api.deepseek.com}
  knowledge:
    notes-path: ${STOCKCAL_NOTES_PATH:}
    auto-extract: ${STOCKCAL_KNOWLEDGE_AUTO_EXTRACT:true}
  sms-api-key: ${SMS_API_KEY:}
  sms-dev-code: ${SMS_DEV_CODE:000000}
  market-api-key: ${TUSHARE_TOKEN:${MARKET_API_KEY:}}
  ai-api-key: ${OPENAI_API_KEY:${AI_API_KEY:}}
