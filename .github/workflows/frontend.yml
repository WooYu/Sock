name: Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches: [main, agent/local-first-watchlist]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
