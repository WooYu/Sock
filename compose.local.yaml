name: sock-local

# Host development services. Run Java and Next.js on the host; no provider key required.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockcal
      POSTGRES_USER: stockcal
      POSTGRES_PASSWORD: stockcal
    ports:
      - "127.0.0.1:${STOCKCAL_LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockcal -d stockcal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${STOCKCAL_LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
