services:
  tag-worker:
    build:
      context: ./frontend
      dockerfile: tag-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - /root/stockcal-tag-worker/worker.env
    environment:
      PORT: "3010"
      CODEX_HOME: /tmp/codex
      STOCKCAL_CODEX_ENABLED: "false"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
