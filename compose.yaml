services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockcal
      POSTGRES_USER: stockcal
      POSTGRES_PASSWORD: stockcal
    ports:
      - "5432:5432"
    volumes:
      - stockcal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockcal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - stockcal_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stockcal_postgres:
  stockcal_redis:
